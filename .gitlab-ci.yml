# Continuous integration for n8n-nodes-purelymail.
#
# verify  - builds, lints and tests on every branch push and merge request. The tests never call the
#           live API, so no credentials are needed.
# publish - manual, tag only. Publishes with an npm provenance statement (signed by Sigstore, publicly
#           verifiable). It needs a CI/CD variable NPM_TOKEN, masked and protected, holding an npm
#           token with publish permission.

stages:
  - verify
  - publish

default:
  image: node:24
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/

verify:
  stage: verify
  script:
    - npm ci --no-audit --no-fund --cache .npm
    - npm run build
    - npm run lint
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

publish:
  stage: publish
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - npm ci --no-audit --no-fund --cache .npm
    - npm publish --provenance --access public
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
